<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臨時募集カレンダー</title>
<style>
* { box-sizing: border-box;}
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background: #fff; color: #3c4043;}
.header { background: #fff; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; z-index: 100; padding: 10px 15px;}
.title { font-size: 16px; font-weight: bold; text-align: center;}
.version { text-align: center; font-size: 11px; color: #9aa0a6; padding-top: 4px;}
.nav { display: flex; justify-content: space-between; align-items: center; margin-top: 8px;}
button { padding: 6px 10px; border: 1px solid #dadce0; border-radius: 4px; color: #1a73e8; background: #fff; cursor: pointer; font-size: 13px; font-weight: bold;}
button.active { background: #1a73e8; color: #fff; border-color: #1a73e8;}
.updated { text-align: center; font-size: 11px; color: #5f6368; margin-top: 6px;}
.body { padding: 8px; padding-bottom: 80px; max-width: 900px; margin: 0 auto;}
h2 { font-size: 14px; margin: 16px 4px 8px;}
.month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: #e0e0e0; border: 1px solid #e0e0e0; margin: 4px; border-radius: 8px; overflow: hidden;}
.month-head { font-size: 10px; text-align: center; padding: 6px 0; font-weight: bold; background: #f1f3f4;}
.cell { background: #fff; min-height: 70px; padding: 4px 6px; cursor: pointer; overflow: hidden;}
.cell.other { background: #f8f9fa;}
.cell.sel { outline: 2px solid #1a73e8; outline-offset: -2px;}
.cell .num { font-size: 14px; font-weight: 700; text-align: left; line-height: 1.3;}
.cell .att { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.4; margin-top: 4px;}
.cell .bad { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.4; margin-top: 1px;}
.cell.sub { font-size: 9px; text-align: center; color: #5f6368;}
.detail { border: 1px solid #e0e0e0; border-radius: 6px; padding: 12px; margin: 8px 4px; background: #f8f9fa; font-size: 13px; line-height: 1.7;}
.detail h3 { margin: 0 0 8px; font-size: 14px;}
.detail ul { margin: 4px 0 10px; padding-left: 20px;}
.tag { display: inline-block; font-size: 11px; font-weight: bold; border-radius: 3px; padding: 1px 6px; margin-left: 6px;}
.tag.all { background: #C73836; color: #fff;}
.tag.gomi { background: #E67E22; color: #fff;}
.tag.work { background: #E67E22; color: #fff;}
.tag.chk { background: #5f6368; color: #fff;}
.tag.avail { background: #fff; color: #1a73e8; border: 1px solid #1a73e8;}
.status { padding: 20px; text-align: center; color: #5f6368;}
.sec-label { font-size: 12px; font-weight: bold; color: #5f6368; margin-top: 10px;}
</style>
</head>
<body>
<div class="header">
<div class="title">臨時募集カレンダー</div>
<div class="version">rinji ver.24 2026-11-17 青・白・赤の配色</div>
<div class="nav">
<button id="btn-prev" onclick="moveMonth(-1)">◀ 前月</button>
<button id="btn-today" onclick="goThisMonth()">今月</button>
<button id="btn-next" onclick="moveMonth(1)">翌月 ▶</button>
</div>
<div class="updated" id="updated">読み込み中…</div>
</div>
<div class="body">
<h2>月表示</h2>
<div id="month-view"><div class="status">読み込み中…</div></div>
<h2>日の内訳</h2>
<div id="day-detail"><div class="status">上の月表示から日を選んでください。</div></div>
</div>
<script>
// 事前計算した「臨時募集用」タブを kinmu API (?action=rinji) から読むだけ。
// 集計は GAS（rinji-calendar-refresh.gs）が30分おきに行う。
// 未決物件も代行に数える。代行合計 ＝ 代行なし ＋ 部分代行 ＋ 未決。
// カレンダーの色は1人あたりの負担率（負担件数 ÷ 実働人数）で連続的に決まる。実働人数 ＝ 出勤人数 − 半日 × 0.5。負担率1.1を境に、低い方は青（大丈夫）、1.1前後は白（普通）、高い方は赤（やばい）へ滑らかに変わる。1.0はもう安全圏（薄い青）。負担率が少し違うだけでも色が少し変わる（1.2と1.4は違う色）。出勤0人の日は一番濃い赤（12/31〜1/3は例外で白）。文字色は背景の明るさで白か濃い字かを決める。セルの中身は左上に日付（大きく）、その下に出勤人数と代行件数を同じサイズで2行。色弱の人にも分かるよう青は明るく赤は暗くして明暗の差を大きくし、出勤・代行の数字も必ず出すので色だけに頼らない。青と赤は赤緑色弱の人にも見分けやすい組み合わせ。
// 負担件数 ＝ 代行 − ゴミのみ × 2/3（ゴミ出しのみは3件で1件分）。
var KINMU_API = "https://script.google.com/macros/s/AKfycbwUub9-EQtMu-TshMRfrCHFBUT1IlcbKIgJImX9m87KS8lfYM0PprTWQF79t2wVPxY1/exec?action=rinji";
var WD = ["日", "月", "火", "水", "木", "金", "土"];

var curYear, curMonth; // curMonth は 0始まり
var daysMap = {}; // "YYYY/MM/DD" -> day object
var rinjiUpdated = "";
var loaded = false;

function fmtDate(d) {
return d.getFullYear() + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + "/" + ("0" + d.getDate()).slice(-2);
}
function parseKinmuDate(s) {
var p = (s || "").split("/");
return new Date(+p[0], +p[1] - 1, +p[2]);
}
function esc(s) {
return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function fmtUpdated(s) {
var dt = new Date(s);
if (isNaN(dt.getTime())) return s || "";
function p(n) { return ("0" + n).slice(-2); }
return dt.getFullYear() + "/" + p(dt.getMonth() + 1) + "/" + p(dt.getDate()) + " " + p(dt.getHours()) + ":" + p(dt.getMinutes());
}
// 負担率からセルの色を連続的に決める（1.2と1.4でも色が変わる）。
// アンカー（負担率→色）を直線でつなぐ。白→薄い黄→黄→オレンジ→深い赤へ滑らかに変わる。
var COLOR_STOPS = [
[0.0, 144, 202, 249],
[0.5, 200, 229, 252],
[1.1, 255, 255, 255],
[1.5, 255, 204, 188],
[2.0, 255, 171, 145],
[2.5, 255, 138, 101],
[3.0, 244, 81, 30],
[3.5, 216, 67, 21],
[4.0, 183, 28, 28]
];
function colorForRate(rate) {
if (rate == null) return [183, 28, 28];
if (rate <= 0) return [144, 202, 249];
if (rate >= 4) return [183, 28, 28];
for (var i = 0; i < COLOR_STOPS.length - 1; i++) {
var a = COLOR_STOPS[i], b = COLOR_STOPS[i + 1];
if (rate >= a[0] && rate <= b[0]) {
var t = (rate - a[0]) / (b[0] - a[0]);
return [Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t), Math.round(a[3] + (b[3] - a[3]) * t)];
}
}
return [183, 28, 28];
}
function textColorFor(rgb) {
var lum = 0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2];
return lum < 150 ? "#ffffff" : "#3c4043";
}
function rgbStr(rgb) { return "rgb(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ")"; }
function isYearEndClosed(dateStr) {
var p = dateStr.split("/");
var m = parseInt(p[1], 10), dd = parseInt(p[2], 10);
return (m === 12 && dd === 31) || (m === 1 && dd <= 3);
}

function buildDays(rows) {
daysMap = {};
(rows || []).forEach(function (r) {
var total = (r.emp || 0) + (r.alb || 0) + (r.other || 0);
var effective = (r.effective == null ? total : r.effective);
var gomi = (r.partialGomi || 0) + (r.undecGomi || 0);
var burden = (r.shortage || 0) - gomi * 2 / 3;
var rate = effective > 0 ? burden / effective : null;
daysMap[r.date] = {
date: r.date, weekday: r.weekday,
emp: r.emp || 0, alb: r.alb || 0, other: r.other || 0, total: total,
halfDay: r.halfDay || 0, effective: effective, rate: rate, gomi: gomi, burden: burden,
off: r.off || 0, avail: r.avail || 0,
uncovered: r.uncovered || 0, partialGomi: r.partialGomi || 0, partialWork: r.partialWork || 0,
covered: r.covered || 0, undec: r.undec || 0, undecGomi: r.undecGomi || 0, undecFull: r.undecFull || 0, finals: r.finals || 0,
staffOff: r.staffOff || 0, unknown: r.unknown || 0, unknownNames: r.unknownNames || [],
shortage: r.shortage || 0, net: r.net || 0
};
});
}

function render() {
var y = curYear, m = curMonth; // m は 0始まり
document.getElementById("updated").textContent =
"対象: " + y + "年" + (m + 1) + "月" + (rinjiUpdated ? " ／ 更新: " + fmtUpdated(rinjiUpdated) : "");
// 月表示
var first = new Date(y, m, 1);
var start = new Date(y, m, 1 - first.getDay());
var last = new Date(y, m + 1, 0);
var end = new Date(y, m + 1, 6 - last.getDay());
var mh = "";
["日", "月", "火", "水", "木", "金", "土"].forEach(function (w) { mh += '<div class="month-head">' + w + '</div>'; });
var cells = "";
var cur = new Date(start);
while (cur <= end) {
var key = fmtDate(cur);
var d = daysMap[key];
var other = cur.getMonth() !== m ? " other" : "";
if (d) {
var bg;
if (d.rate == null) {
if ((d.shortage || 0) > 0) {
bg = isYearEndClosed(d.date) ? colorForRate(1.1) : [183, 28, 28];
} else {
bg = [253, 253, 253];
}
} else {
bg = colorForRate(d.rate);
}
var fg = textColorFor(bg);
cells += '<div class="cell' + other + '" style="background:' + rgbStr(bg) + ';color:' + fg + ';" id="cell-' + key.replace(/\//g, "-") + '" onclick="selectDay(\'' + key + '\')">'
+ '<div class="num">' + cur.getDate() + '</div>'
+ '<div class="att">出勤' + d.total + '</div>'
+ '<div class="bad">' + (d.shortage > 0 ? "代行" + d.shortage : "—") + '</div></div>';
} else {
cells += '<div class="cell' + other + '"><div class="num">' + cur.getDate() + '</div></div>';
}
cur.setDate(cur.getDate() + 1);
}
document.getElementById("month-view").innerHTML = '<div class="month-grid">' + mh + cells + '</div>';
}

function selectDay(key) {
var d = daysMap[key];
if (!d) return;
document.querySelectorAll(".cell.sel").forEach(function (el) { el.classList.remove("sel"); });
var cell = document.getElementById("cell-" + key.replace(/\//g, "-"));
if (cell) cell.classList.add("sel");
var dt = parseKinmuDate(d.date);
var daiS = d.undecGomi ? '代行 ' + d.shortage + '件（ゴミのみ' + d.undecGomi + '・全部' + d.undecFull + '）' : '代行 ' + d.shortage + '件';
var rateS = d.rate == null ? '' : '・1人あたり' + d.rate.toFixed(1) + '件';
var html = "<h3>" + d.date + " (" + WD[dt.getDay()] + ")　出勤 " + d.total + "人・" + daiS + rateS + "・臨時可能 " + d.avail + "人</h3>";
html += "<div>出勤 " + d.total + "人（社" + d.emp + "・ア" + d.alb + "・他" + d.other + "）　実働 " + d.effective + "人（半日 " + d.halfDay + "人）　休み " + d.off + "人　臨可 " + d.avail + "人　代行手配済み " + d.covered + "件</div>";
html += '<div class="sec-label">代行が必要な内訳（臨時募集の対象）</div>';
var partial = d.partialGomi + d.partialWork;
var undecS = d.undecGomi ? '未決 ' + d.undec + '件（ゴミのみ' + d.undecGomi + '件・全部' + d.undecFull + '件）' : '未決 ' + d.undec + '件';
html += "<div>休暇 " + d.uncovered + "件・部分代行 " + partial + "件（ゴミ出しのみ代行 " + d.partialGomi + "件・作業のみ代行 " + d.partialWork + "件）・" + undecS + "</div>";
if (d.gomi) html += "<div>負担換算 " + d.burden.toFixed(1) + "件（ゴミのみ " + d.gomi + "件を3件で1件分として換算）</div>";
if (d.staffOff) {
html += "<div>社員の休み " + d.staffOff + "件（社員休暇カレンダー）</div>";
}
if (d.finals) {
html += "<div>最終作業日 " + d.finals + "件（別枠）</div>";
}
if (d.unknown) {
html += '<div class="sec-label">要確認（説明に代行の行がなく、代行の件数に数えていない）</div><ul>';
d.unknownNames.forEach(function (n) { html += "<li>" + esc(n) + "<span class='tag chk'>要確認</span></li>"; });
if (!d.unknownNames.length) html += "<li>" + d.unknown + "件</li>";
html += "</ul>";
}
document.getElementById("day-detail").innerHTML = '<div class="detail">' + html + "</div>";
document.getElementById("day-detail").scrollIntoView({ block: "nearest" });
}

function loadMonth(y, m) {
curYear = y; curMonth = m;
if (loaded) { render(); return; }
document.getElementById("month-view").innerHTML = '<div class="status">読み込み中…</div>';
document.getElementById("updated").textContent = "読み込み中…";
fetch(KINMU_API).then(function (r) { return r.json(); }).then(function (res) {
rinjiUpdated = res.updatedAt || "";
buildDays(res.days || []);
loaded = true;
render();
}).catch(function (e) {
document.getElementById("month-view").innerHTML = '<div class="status">読み込みに失敗しました。もう一度お試しください。</div>';
});
}
function moveMonth(dir) {
var d = new Date(curYear, curMonth + dir, 1);
loadMonth(d.getFullYear(), d.getMonth());
}
function goThisMonth() {
var n = new Date();
loadMonth(n.getFullYear(), n.getMonth());
}
(function () {
var n = new Date();
loadMonth(n.getFullYear(), n.getMonth());
})();
</script>
</body>
</html>
