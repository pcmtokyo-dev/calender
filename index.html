<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カレンダービューア</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        overflow-x: hidden;
        width: 100vw;
      }

      /* ヘッダー・カレンダーフィルター周り */
      .header {
        background-color: #fff;
        border-bottom: 1px solid #e0e0e0;
        position: sticky;
        top: 0;
        z-index: 100;
        width: 100%;
      }
      .filter-container {
        background-color: #f8f9fa;
        border-bottom: 1px solid #e0e0e0;
        padding: 8px 15px;
      }
      .filter-summary {
        font-size: 13px;
        color: #1a73e8;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
      }
      .filter-options {
        display: none;
        padding-top: 10px;
        flex-wrap: wrap;
        gap: 12px;
      }
      .filter-options.show {
        display: flex;
      }
      .cal-label {
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        color: #3c4043;
      }

      .nav-container {
        padding: 10px 15px;
      }
      .nav-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .header-center {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .header-title {
        font-size: 16px;
        font-weight: bold;
        color: #3c4043;
        text-align: center;
      }
      .btn-today {
        padding: 4px 8px;
        font-size: 11px;
        border-radius: 4px;
        border: 1px solid #dadce0;
        background: #fff;
        cursor: pointer;
        font-weight: bold;
        color: #5f6368;
      }
      .btn-today:active {
        background-color: #f1f3f4;
      }

      /* 改善点1: 読み込み中もボタンは止めない。表示を消さず、小さな表示だけ出す */
      .loading-indicator {
        display: none;
        font-size: 11px;
        color: #5f6368;
        white-space: nowrap;
      }
      .loading-indicator.show {
        display: inline;
      }
      #calendar-content.loading {
        opacity: 0.6;
      }

      .btn-group {
        display: flex;
        gap: 5px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .jump-container {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 8px;
        font-size: 12px;
        color: #5f6368;
      }
      .jump-container input,
      .jump-container select {
        font-size: 13px;
        padding: 4px 6px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        color: #3c4043;
        background: #fff;
      }
      .month-cell.skeleton-cell {
        color: #bdc1c6;
      }
      button {
        padding: 6px 10px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        color: #1a73e8;
        background: white;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
      }
      button.active {
        background-color: #1a73e8;
        color: white;
        border-color: #1a73e8;
      }
      button:active {
        background-color: #f1f3f4;
      }
      .nav-btn {
        font-size: 16px;
        padding: 4px 12px;
        color: #5f6368;
      }

      /* リストスタイル */
      .list-container {
        padding: 8px;
        padding-bottom: 80px;
        width: 100%;
      }
      .list-columns {
        display: flex;
        gap: 8px;
        width: 100%;
      }
      .list-col {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .event-wrapper {
        margin-bottom: 2px;
        width: 100%;
      }
      .event-header {
        padding: 4px 8px;
        border-radius: 3px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        min-height: 18px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .event-wrapper.expanded.event-header {
        border-radius: 3px 3px 0 0;
        white-space: normal;
      }
      .event-details {
        display: none;
        background-color: #f8f9fa;
        padding: 10px;
        border: 1px solid #e0e0e0;
        border-top: none;
        border-radius: 0 0 3px 3px;
        color: #3c4043;
        font-size: 12px;
        line-height: 1.5;
      }
      .event-wrapper.expanded.event-details {
        display: block;
      }
      .detail-item {
        display: flex;
        margin-bottom: 8px;
      }
      .detail-item:last-child {
        margin-bottom: 0;
      }
      .detail-icon {
        width: 20px;
        margin-right: 8px;
        flex-shrink: 0;
        color: #5f6368;
        text-align: center;
      }

      /* 縦グリッドスタイル */
      .grid-container {
        display: grid;
        gap: 2px;
        padding: 4px;
        padding-bottom: 80px;
        width: 100%;
      }
      .grid-day-col {
        display: flex;
        flex-direction: column;
        gap: 2px;
        background-color: #f8f9fa;
        border-radius: 4px;
        padding: 2px;
        min-height: 300px;
        min-width: 0;
        cursor: pointer;
      }
      .day-label {
        font-size: 11px;
        text-align: center;
        padding: 4px 0;
        font-weight: bold;
        border-bottom: 2px solid #dadce0;
        background-color: #fff;
        margin-bottom: 2px;
      }
      .grid-event {
        font-size: 10px;
        padding: 3px 4px;
        border-radius: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
      }

      /* 月間カレンダースタイル */
      .month-container {
        padding: 4px;
        padding-bottom: 80px;
        width: 100%;
      }
      .month-day-header {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        background-color: #f1f3f4;
        border-radius: 4px 4px 0 0;
      }
      .month-day-name {
        font-size: 10px;
        text-align: center;
        padding: 6px 0;
        font-weight: bold;
        color: #5f6368;
      }
      .month-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 1px;
        background-color: #e0e0e0;
        border: 1px solid #e0e0e0;
        border-top: none;
      }
      .month-cell {
        background-color: #fff;
        min-height: 70px;
        display: flex;
        flex-direction: column;
        padding: 2px;
        overflow: hidden;
        min-width: 0;
        cursor: pointer;
      }
      .month-cell.other-month {
        background-color: #f8f9fa;
      }
      .month-date-num {
        font-size: 11px;
        text-align: center;
        margin-bottom: 2px;
        color: #3c4043;
        font-weight: bold;
        pointer-events: none;
      }
      .month-cell.other-month.month-date-num {
        color: #bdc1c6;
      }
      .month-event {
        font-size: 9px;
        padding: 2px 3px;
        margin-bottom: 2px;
        border-radius: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
        font-weight: bold;
        line-height: 1.2;
        width: 100%;
      }

      /* 全文表示モード */
      .wrap-text.grid-event,
      .wrap-text.month-event {
        white-space: normal;
        word-break: break-all;
      }

      /* モーダル */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.4);
      }
      .modal.show {
        display: block;
      }
      .modal-content {
        background-color: #fff;
        padding: 15px;
        border-radius: 8px;
        width: 85%;
        max-width: 350px;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        color: #3c4043;
        font-size: 13px;
        line-height: 1.5;
      }
      .modal-title {
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 12px;
        padding-right: 20px;
        word-break: break-all;
      }
      .close-btn {
        position: absolute;
        top: 10px;
        right: 12px;
        font-size: 20px;
        cursor: pointer;
        color: #5f6368;
        font-weight: bold;
      }
      .status-message {
        padding: 20px;
        text-align: center;
        color: #5f6368;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="filter-container">
        <div class="filter-summary" onclick="toggleFilter()">
          <span id="filter-text">カレンダー選択 (読み込み中...)</span>
          <span id="filter-arrow">▼</span>
        </div>
        <div id="filter-options" class="filter-options"></div>
      </div>

      <div class="nav-container">
        <div class="nav-row">
          <button class="nav-btn" onclick="changeDate(-1)">◀</button>
          <div class="header-center">
            <div id="header-title" class="header-title">--</div>
            <span id="loading-indicator" class="loading-indicator"
              >読込中…</span
            >
            <button onclick="goToToday()" class="btn-today">今日</button>
          </div>
          <button class="nav-btn" onclick="changeDate(1)">▶</button>
        </div>

        <div class="btn-group">
          <button onclick="changeMode('1')" id="btn-1">1日</button>
          <button onclick="changeMode('3')" id="btn-3">3日</button>
          <button onclick="changeMode('7')" id="btn-7">1週間</button>
          <button onclick="changeMode('month')" id="btn-month">1ヶ月</button>
          <button
            onclick="toggleTextWrap()"
            id="btn-wrap"
            style="margin-left: 5px"
          >
            全文表示
          </button>
        </div>

        <div class="jump-container">
          <label>
            その日を表示
            <input
              type="date"
              id="date-picker"
              onchange="jumpToPickedDate(this.value)"
            />
          </label>
          <label>
            年
            <select id="year-select" onchange="jumpToYearMonth()"></select>
          </label>
          <label>
            月
            <select id="month-select" onchange="jumpToYearMonth()"></select>
          </label>
        </div>
      </div>
    </div>

    <div id="calendar-content">
      <div class="status-message">読み込み中...</div>
    </div>

    <div id="detail-modal" class="modal">
      <div class="modal-content" id="modal-content-box">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modal-body"></div>
      </div>
    </div>

    <script>
      // ==================================
      // GASを新しいCode.gsで再デプロイしたら、URLが変わった場合だけここを差し替えてください。
      const gasUrl =
        "https://script.google.com/macros/s/AKfycbzH0bnxWZFAE_ApMO5BKKeiewwMtlehvd47A95YP9jYD4t33yAGLIK1CPm6fEaDKTOutw/exec";

      const calendarIds = [
        "pcm.tokyo@gmail.com",
        "2nal2vfrf98qddgbl0janhdjhk@group.calendar.google.com",
        "7v6f4h2bbd41v7vfictq5pppfo@group.calendar.google.com",
        "si819hvg2rep07i32vbtaboh18@group.calendar.google.com",
        "t8e0hakn7kjgdel4mpvjmdljuo@group.calendar.google.com",
      ];

      // 先読みを止めたい場合は false にしてください。
      const PREFETCH_ENABLED = true;
      // 一覧キャッシュの有効期間（ミリ秒）。GAS側の5分と合わせています。
      const CACHE_TTL_MS = 5 * 60 * 1000;
      // =============================================

      function saveState() {
        try {
          localStorage.setItem("calViewer_mode", currentMode);
          localStorage.setItem(
            "calViewer_date",
            currentDate.getTime().toString(),
          );
          localStorage.setItem("calViewer_wrap", isTextWrap.toString());
          localStorage.setItem(
            "calViewer_activeCals",
            JSON.stringify(Array.from(activeCalIds)),
          );
        } catch (e) {
          console.warn("Storage saving failed", e);
        }
      }

      let currentMode = "1";
      let isTextWrap = false;
      let currentDate = new Date();
      let activeCalIds = new Set();
      let isInitialLoad = true;
      let fetchedEvents = [];
      let fetchedCalendars = [];

      // 改善の要: 取得済み期間のキャッシュ、進行中リクエストの管理
      const rangeCache = new Map();
      const detailCache = new Map();
      let requestSeq = 0;
      let currentAbort = null;
      let prefetchTimer = null;

      try {
        const savedMode = localStorage.getItem("calViewer_mode");
        if (savedMode) currentMode = savedMode;

        const savedWrap = localStorage.getItem("calViewer_wrap");
        if (savedWrap) isTextWrap = savedWrap === "true";

        const savedDateStr = localStorage.getItem("calViewer_date");
        if (savedDateStr) {
          const parsedDate = new Date(parseInt(savedDateStr));
          if (!isNaN(parsedDate.getTime())) currentDate = parsedDate;
        }

        const savedActiveCals = localStorage.getItem("calViewer_activeCals");
        if (savedActiveCals) {
          const arr = JSON.parse(savedActiveCals);
          if (Array.isArray(arr)) arr.forEach((id) => activeCalIds.add(id));
        }
      } catch (e) {
        console.warn("Storage loading failed", e);
      }
      currentDate.setHours(0, 0, 0, 0);

      function initWrapUI() {
        const btn = document.getElementById("btn-wrap");
        if (isTextWrap) {
          btn.innerText = "省略表示";
          btn.classList.add("active");
        } else {
          btn.innerText = "全文表示";
          btn.classList.remove("active");
        }
      }
      initWrapUI();
      buildJumpOptions();

      // ---- 日付操作: ここでは表示タイトルだけ即更新し、通信を待たない ----
      function changeMode(mode) {
        if (currentMode === mode) return;
        currentMode = mode;
        loadCalendar();
      }
      function changeDate(dir) {
        if (currentMode === "month") {
          currentDate.setMonth(currentDate.getMonth() + dir);
        } else {
          currentDate.setDate(
            currentDate.getDate() + parseInt(currentMode) * dir,
          );
        }
        loadCalendar();
      }
      function goToToday() {
        currentDate = new Date();
        currentDate.setHours(0, 0, 0, 0);
        loadCalendar();
      }
      function switchToDayView(timestamp) {
        currentDate = new Date(timestamp);
        currentDate.setHours(0, 0, 0, 0);
        currentMode = "1";
        loadCalendar();
      }

      function toggleTextWrap() {
        isTextWrap = !isTextWrap;
        initWrapUI();
        saveState();
        const contentDiv = document.getElementById("calendar-content");
        if (isTextWrap) contentDiv.classList.add("wrap-text");
        else contentDiv.classList.remove("wrap-text");
      }

      function toggleFilter() {
        const opts = document.getElementById("filter-options");
        const arrow = document.getElementById("filter-arrow");
        if (opts.classList.contains("show")) {
          opts.classList.remove("show");
          arrow.innerText = "▼";
        } else {
          opts.classList.add("show");
          arrow.innerText = "▲";
        }
      }

      function formatTime(timestamp, isAllDay) {
        if (isAllDay) return "終日";
        const d = new Date(timestamp);
        return (
          ("0" + d.getHours()).slice(-2) +
          ":" +
          ("0" + d.getMinutes()).slice(-2)
        );
      }
      function escapeAndFormatHtml(str) {
        if (!str) return "";
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\n/g, "<br>");
      }

      function setLoading(isLoading) {
        document
          .getElementById("loading-indicator")
          .classList.toggle("show", isLoading);
        document
          .getElementById("calendar-content")
          .classList.toggle("loading", isLoading);
      }

      // 表示範囲の計算だけを切り出し。先読みでも同じ計算を使います。
      function getRangeFor(mode, baseDate) {
        const y = baseDate.getFullYear();
        const m = baseDate.getMonth();
        let reqStart, reqEnd, displayTitle;

        if (mode === "month") {
          const firstDay = new Date(y, m, 1);
          const lastDay = new Date(y, m + 1, 0);
          reqStart = new Date(y, m, 1 - firstDay.getDay());
          reqEnd = new Date(y, m + 1, 6 - lastDay.getDay() + 1);
          displayTitle = `${y}年 ${m + 1}月`;
        } else {
          reqStart = new Date(baseDate);
          reqEnd = new Date(baseDate);
          reqEnd.setDate(reqEnd.getDate() + parseInt(mode));
          displayTitle = `${m + 1}/${baseDate.getDate()}〜`;
        }
        return { reqStart, reqEnd, displayTitle };
      }

      function updateHeader() {
        const range = getRangeFor(currentMode, currentDate);
        document.getElementById("header-title").innerText = range.displayTitle;
        ["1", "3", "7", "month"].forEach((id) => {
          document
            .getElementById("btn-" + id)
            .classList.toggle("active", currentMode === id);
        });
        syncJumpControls();
        return range;
      }

      function formatDateForInput(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function buildJumpOptions(centerYear) {
        const yearSelect = document.getElementById("year-select");
        const monthSelect = document.getElementById("month-select");
        if (!yearSelect || !monthSelect) return;
        const baseYear = centerYear || new Date().getFullYear();
        const startYear = baseYear - 5;
        let yearHtml = "";
        for (let y = startYear; y <= startYear + 15; y++) {
          yearHtml += `<option value="${y}">${y}年</option>`;
        }
        yearSelect.innerHTML = yearHtml;
        let monthHtml = "";
        for (let m = 1; m <= 12; m++) {
          monthHtml += `<option value="${m}">${m}月</option>`;
        }
        monthSelect.innerHTML = monthHtml;
      }

      function syncJumpControls() {
        const datePicker = document.getElementById("date-picker");
        const yearSelect = document.getElementById("year-select");
        const monthSelect = document.getElementById("month-select");
        if (datePicker) datePicker.value = formatDateForInput(currentDate);
        if (yearSelect) {
          const y = currentDate.getFullYear();
          const hasYear = Array.from(yearSelect.options).some(
            (o) => parseInt(o.value, 10) === y,
          );
          if (!hasYear) buildJumpOptions(y);
          yearSelect.value = String(y);
        }
        if (monthSelect) monthSelect.value = String(currentDate.getMonth() + 1);
      }

      // 日付入力: その日を1日表示で開く。読み込み中でもヘッダーは生きている。
      function jumpToPickedDate(value) {
        if (!value) return;
        const parts = value.split("-").map((v) => parseInt(v, 10));
        if (parts.length !== 3 || parts.some((v) => isNaN(v))) return;
        currentDate = new Date(parts[0], parts[1] - 1, parts[2]);
        currentDate.setHours(0, 0, 0, 0);
        currentMode = "1";
        loadCalendar();
      }

      // 年・月ドロップリスト: その月を1ヶ月表示で開く。
      function jumpToYearMonth() {
        const yearSelect = document.getElementById("year-select");
        const monthSelect = document.getElementById("month-select");
        const y = parseInt(yearSelect.value, 10);
        const m = parseInt(monthSelect.value, 10);
        if (isNaN(y) || isNaN(m)) return;
        if (
          currentMode === "month" &&
          currentDate.getFullYear() === y &&
          currentDate.getMonth() === m - 1
        ) {
          return;
        }
        currentDate = new Date(y, m - 1, 1);
        currentMode = "month";
        loadCalendar();
      }

      // 予定が届く前に、日付の枠だけ先に描く。これで読み込み中でも日付が選べる。
      function renderSkeleton(range) {
        const contentDiv = document.getElementById("calendar-content");
        if (currentMode === "month") {
          contentDiv.className = "month-container";
          let html = '<div class="month-day-header">';
          ["日", "月", "火", "水", "木", "金", "土"].forEach(
            (day) => (html += `<div class="month-day-name">${day}</div>`),
          );
          html += '</div><div class="month-grid">';
          let iterDate = new Date(range.reqStart);
          while (iterDate < range.reqEnd) {
            const isOtherMonth = iterDate.getMonth() !== currentDate.getMonth();
            const cellClass = isOtherMonth
              ? "month-cell other-month skeleton-cell"
              : "month-cell skeleton-cell";
            html += `<div class="${cellClass}" onclick="switchToDayView(${iterDate.getTime()})">
                      <div class="month-date-num">${iterDate.getDate()}</div>
                    </div>`;
            iterDate.setDate(iterDate.getDate() + 1);
          }
          html += "</div>";
          contentDiv.innerHTML = html;
        } else if (currentMode === "3" || currentMode === "7") {
          contentDiv.className = "grid-container";
          contentDiv.style.gridTemplateColumns = `repeat(${currentMode}, minmax(0, 1fr))`;
          let html = "";
          for (let i = 0; i < parseInt(currentMode); i++) {
            let targetDate = new Date(currentDate.getTime() + i * 86400000);
            let dayName = ["日", "月", "火", "水", "木", "金", "土"][
              targetDate.getDay()
            ];
            html += `<div class="grid-day-col" onclick="switchToDayView(${targetDate.getTime()})"><div class="day-label">${targetDate.getDate()}(${dayName})</div></div>`;
          }
          contentDiv.innerHTML = html;
        } else {
          contentDiv.className = "list-container";
          contentDiv.innerHTML =
            '<div class="status-message">読み込み中…</div>';
        }
        if (isTextWrap) contentDiv.classList.add("wrap-text");
      }

      function rangeKey(mode, reqStart, reqEnd, ids) {
        return `${mode}|${reqStart.getTime()}|${reqEnd.getTime()}|${ids.join(",")}`;
      }

      // 色弱配慮：最終作業日は、GASが古いままでもタイトルで判定して上書きする。
      // 立会あり＝赤 #C73836、立会なし＝青 #0072B2（Okabe-Ito）。どちらも白文字。
      // 赤とオレンジは色弱の方には茶色に寄って見分けにくいため、オレンジは使わない。
      function normalizeFinalWorkDay(ev) {
        if (!ev.title || ev.title.indexOf("最終作業日") !== 0) return ev;
        ev.isFinal = true;
        if (ev.title.indexOf("立会なし") !== -1) {
          ev.finalKind = "なし";
          ev.color = "#0072B2";
          ev.textColor = "#ffffff";
        } else if (ev.title.indexOf("立会あり") !== -1) {
          ev.finalKind = "あり";
          ev.color = "#C73836";
          ev.textColor = "#ffffff";
        }
        return ev;
      }

      // 色だけに頼らないための枠線。最終作業日は黒い枠で囲み、他の予定と区別する。
      function finalEventExtraStyle(ev) {
        const isFinal =
          ev.isFinal || (ev.title && ev.title.indexOf("最終作業日") === 0);
        return isFinal ? " box-shadow: inset 0 0 0 2px #222222;" : "";
      }

      function applyData(data) {
        fetchedEvents = (data.events || []).map(normalizeFinalWorkDay);
        fetchedCalendars = data.calendars || [];

        if (isInitialLoad) {
          if (activeCalIds.size === 0) {
            fetchedCalendars.forEach((cal) => activeCalIds.add(cal.id));
          } else {
            const validIds = new Set(fetchedCalendars.map((c) => c.id));
            const filteredSet = new Set();
            activeCalIds.forEach((id) => {
              if (validIds.has(id)) filteredSet.add(id);
            });
            activeCalIds = filteredSet;
          }
          buildFilterUI();
          isInitialLoad = false;
        } else {
          updateFilterText();
        }

        saveState();
        renderCalendar();
      }

      // 改善の要: 前の表示を残したまま、裏で取得する。古い応答は捨てる。
      async function loadCalendar() {
        const range = updateHeader();
        const contentDiv = document.getElementById("calendar-content");

        // 初回は全カレンダーを取り、2回目以降は選択中のものだけ取りに行く。
        // これだけで、絞り込み中のGAS負荷と転送量が減ります。
        const idsToRequest = isInitialLoad
          ? calendarIds
          : Array.from(activeCalIds);

        if (!isInitialLoad && idsToRequest.length === 0) {
          fetchedEvents = [];
          setLoading(false);
          renderCalendar();
          return;
        }

        const key = rangeKey(
          currentMode,
          range.reqStart,
          range.reqEnd,
          idsToRequest,
        );
        const cached = rangeCache.get(key);
        if (cached && Date.now() - cached.at < CACHE_TTL_MS) {
          setLoading(false);
          applyData(cached.data);
          schedulePrefetch();
          return;
        }

        // 予定が届く前に、新しい期間の日付の枠だけ先に描く。
        // 枠の日付はクリックできるので、読み込み完了を待たずに次の日へ進める。
        // ヘッダーの日付入力・年・月ドロップリストも、通信中は止めない。
        renderSkeleton(range);
        setLoading(true);
        const seq = ++requestSeq;
        if (currentAbort) currentAbort.abort();
        const controller = new AbortController();
        currentAbort = controller;

        try {
          const url = `${gasUrl}?start=${range.reqStart.getTime()}&end=${range.reqEnd.getTime()}&calIds=${encodeURIComponent(idsToRequest.join(","))}`;
          const response = await fetch(url, {
            method: "GET",
            redirect: "follow",
            signal: controller.signal,
          });
          const data = await response.json();
          rangeCache.set(key, { data, at: Date.now() });

          // 自分より新しい操作が始まっていたら、この古い結果は描画しない。
          if (seq !== requestSeq) return;
          setLoading(false);
          applyData(data);
          schedulePrefetch();
        } catch (e) {
          if (e.name === "AbortError") return;
          if (seq !== requestSeq) return;
          setLoading(false);
          // 失敗しても前の表示を残す。何も表示していない初回だけエラーを出す。
          if (!fetchedEvents.length && isInitialLoad) {
            contentDiv.innerHTML =
              '<div class="status-message">エラーが発生しました。もう一度お試しください。</div>';
          }
          document.getElementById("filter-text").innerText =
            "読込に失敗しました（前の表示を残しています）";
        }
      }

      // 旧関数名のまま呼んでいる場所があっても動くように残します。
      function fetchCalendarData() {
        loadCalendar();
      }

      function schedulePrefetch() {
        if (!PREFETCH_ENABLED) return;
        if (prefetchTimer) clearTimeout(prefetchTimer);
        const modeAtSchedule = currentMode;
        const dateAtSchedule = new Date(currentDate.getTime());
        const idsAtSchedule = isInitialLoad
          ? calendarIds
          : Array.from(activeCalIds);
        if (!idsAtSchedule.length) return;

        const run = () => {
          prefetchAdjacent(modeAtSchedule, dateAtSchedule, idsAtSchedule);
        };
        // 描画を邪魔しないよう、アイドル時（なければ400ms後）にだけ先読みする。
        if (window.requestIdleCallback) {
          window.requestIdleCallback(run, { timeout: 2000 });
        } else {
          prefetchTimer = setTimeout(run, 400);
        }
      }

      function prefetchAdjacent(mode, baseDate, ids) {
        const offsets = [];
        if (mode === "month") {
          offsets.push(-1, 1);
        } else {
          offsets.push(-parseInt(mode), parseInt(mode));
        }

        offsets.forEach((offset) => {
          const target = new Date(baseDate.getTime());
          if (mode === "month") {
            target.setMonth(target.getMonth() + offset);
          } else {
            target.setDate(target.getDate() + offset);
          }
          const range = getRangeFor(mode, target);
          const key = rangeKey(mode, range.reqStart, range.reqEnd, ids);
          const cached = rangeCache.get(key);
          if (cached && Date.now() - cached.at < CACHE_TTL_MS) return;

          const url = `${gasUrl}?start=${range.reqStart.getTime()}&end=${range.reqEnd.getTime()}&calIds=${encodeURIComponent(ids.join(","))}`;
          fetch(url, { method: "GET", redirect: "follow" })
            .then((res) => res.json())
            .then((data) => {
              rangeCache.set(key, { data, at: Date.now() });
            })
            .catch(() => {
              /* 先読みの失敗は無視し、実際に開いたときに取り直す */
            });
        });
      }

      async function openEventModal(eventId, event) {
        const ev = fetchedEvents.find((e) => e.id === eventId);
        if (!ev) return;

        const timeStr = ev.isAllDay
          ? "終日"
          : formatTime(ev.startTime) + " - " + formatTime(ev.endTime);
        const modalBody = document.getElementById("modal-body");

        const renderModalBody = (location, description) => {
          let html = `<div class="modal-title" style="border-left: 5px solid ${ev.color}; padding-left: 8px;">${escapeAndFormatHtml(ev.title)}</div>`;
          html += `<div class="detail-item"><div class="detail-icon">🕒</div><div>${timeStr}</div></div>`;
          if (location)
            html += `<div class="detail-item"><div class="detail-icon">📍</div><div>${escapeAndFormatHtml(location)}</div></div>`;
          if (description)
            html += `<div class="detail-item"><div class="detail-icon">📝</div><div>${escapeAndFormatHtml(description)}</div></div>`;
          modalBody.innerHTML = html;
        };

        // 旧GASのまま一覧に詳細が入っている場合は、そのまま表示する。
        if (ev.location !== undefined || ev.description !== undefined) {
          renderModalBody(ev.location, ev.description);
        } else if (!ev.hasDetail) {
          renderModalBody("", "");
        } else if (detailCache.has(ev.id)) {
          const detail = detailCache.get(ev.id);
          renderModalBody(detail.location, detail.description);
        } else {
          renderModalBody("", "詳細を読み込み中…");
          try {
            const eventIdRaw = ev.eventId || ev.id;
            const url = `${gasUrl}?action=getEvent&calId=${encodeURIComponent(ev.calId)}&eventId=${encodeURIComponent(eventIdRaw)}&start=${ev.startTime}&end=${ev.endTime}`;
            const response = await fetch(url, {
              method: "GET",
              redirect: "follow",
            });
            const detail = await response.json();
            if (!detail.error) {
              detailCache.set(ev.id, detail);
              renderModalBody(detail.location, detail.description);
            } else {
              renderModalBody("", "");
            }
          } catch (e) {
            renderModalBody("", "");
          }
        }

        const modal = document.getElementById("detail-modal");
        const modalContentBox = document.getElementById("modal-content-box");
        modalContentBox.style.top = Math.max(20, event.clientY - 60) + "px";
        modal.classList.add("show");
      }

      function closeModal() {
        document.getElementById("detail-modal").classList.remove("show");
      }
      window.onclick = function (event) {
        if (event.target === document.getElementById("detail-modal"))
          closeModal();
      };

      function buildFilterUI() {
        const container = document.getElementById("filter-options");
        let html = "";
        fetchedCalendars.forEach((cal) => {
          const checked = activeCalIds.has(cal.id) ? "checked" : "";
          html += `<label class="cal-label">
<input type="checkbox" value="${cal.id}" onchange="handleFilterChange(this)" ${checked}>
<span style="display:inline-block; width:12px; height:12px; background-color:${cal.color}; border-radius:3px;"></span>
${escapeAndFormatHtml(cal.name)}
</label>`;
        });
        container.innerHTML = html;
        updateFilterText();
      }

      function updateFilterText() {
        document.getElementById("filter-text").innerText =
          `表示するカレンダーを選択 (${activeCalIds.size}/${fetchedCalendars.length} 表示中)`;
      }

      function handleFilterChange(checkbox) {
        if (checkbox.checked) {
          activeCalIds.add(checkbox.value);
        } else {
          activeCalIds.delete(checkbox.value);
        }
        updateFilterText();
        saveState();
        renderCalendar();
      }

      function renderCalendar() {
        const contentDiv = document.getElementById("calendar-content");

        const displayEvents = fetchedEvents
          .filter((ev) => activeCalIds.has(ev.calId))
          .sort((a, b) => {
            if (a.isAllDay && !b.isAllDay) return -1;
            if (!a.isAllDay && b.isAllDay) return 1;
            return a.startTime - b.startTime;
          });

        // 改善: 旧版はセルごとに全イベントを走査していた。日付ごとに1回だけ束ねる。
        const eventsByDate = new Map();
        displayEvents.forEach((ev) => {
          const dateStr = new Date(ev.startTime).toDateString();
          if (!eventsByDate.has(dateStr)) eventsByDate.set(dateStr, []);
          eventsByDate.get(dateStr).push(ev);
        });

        const y = currentDate.getFullYear();
        const m = currentDate.getMonth();
        let reqStart, reqEnd;

        if (currentMode === "month") {
          const range = getRangeFor("month", currentDate);
          reqStart = range.reqStart;
          reqEnd = range.reqEnd;
        }

        if (currentMode === "1") {
          contentDiv.className = "list-container";
          if (displayEvents.length === 0) {
            contentDiv.innerHTML =
              '<div class="status-message">予定はありません。</div>';
          } else {
            const isWideScreen = window.innerWidth >= 768;

            const buildEventHtml = (ev) => {
              const timeStr = ev.isAllDay
                ? "終日"
                : formatTime(ev.startTime) + " - " + formatTime(ev.endTime);
              return `<div class="event-wrapper" id="wrapper-${ev.id}">
<div class="event-header" style="background-color:${ev.color}; color:${ev.textColor};${finalEventExtraStyle(ev)}" onclick="document.getElementById('wrapper-${ev.id}').classList.toggle('expanded')">
${escapeAndFormatHtml(ev.title)}
</div>
<div class="event-details">
<div class="detail-item"><div class="detail-icon">🕒</div><div>${timeStr}</div></div>
${ev.location ? `<div class="detail-item"><div class="detail-icon">📍</div><div>${escapeAndFormatHtml(ev.location)}</div></div>` : ""}
${ev.description ? `<div class="detail-item"><div class="detail-icon">📝</div><div>${escapeAndFormatHtml(ev.description)}</div></div>` : ""}
</div>
</div>`;
            };

            if (isWideScreen) {
              const counts = {};
              displayEvents.forEach(
                (ev) => (counts[ev.calId] = (counts[ev.calId] || 0) + 1),
              );
              const sortedCalIds = Object.keys(counts).sort(
                (a, b) => counts[b] - counts[a],
              );

              let leftCount = 0;
              let rightCount = 0;
              const assignMap = {};

              sortedCalIds.forEach((calId) => {
                if (leftCount <= rightCount) {
                  assignMap[calId] = "left";
                  leftCount += counts[calId];
                } else {
                  assignMap[calId] = "right";
                  rightCount += counts[calId];
                }
              });

              let leftEvents = displayEvents.filter(
                (ev) => assignMap[ev.calId] === "left",
              );
              let rightEvents = displayEvents.filter(
                (ev) => assignMap[ev.calId] === "right",
              );

              let leftHtml = leftEvents.map(buildEventHtml).join("");
              let rightHtml = rightEvents.map(buildEventHtml).join("");

              contentDiv.innerHTML = `
<div class="list-columns">
<div class="list-col">${leftHtml}</div>
<div class="list-col">${rightHtml}</div>
</div>
`;
            } else {
              contentDiv.innerHTML = displayEvents.map(buildEventHtml).join("");
            }
          }
        } else if (currentMode === "3" || currentMode === "7") {
          contentDiv.className = "grid-container";
          contentDiv.style.gridTemplateColumns = `repeat(${currentMode}, minmax(0, 1fr))`;
          let html = "";
          for (let i = 0; i < parseInt(currentMode); i++) {
            let targetDate = new Date(currentDate.getTime() + i * 86400000);
            let dayName = ["日", "月", "火", "水", "木", "金", "土"][
              targetDate.getDay()
            ];
            html += `<div class="grid-day-col" onclick="switchToDayView(${targetDate.getTime()})"><div class="day-label">${targetDate.getDate()}(${dayName})</div>`;

            (eventsByDate.get(targetDate.toDateString()) || []).forEach(
              (ev) => {
                html += `<div class="grid-event" style="background-color:${ev.color}; color:${ev.textColor};${finalEventExtraStyle(ev)}" onclick="openEventModal('${ev.id}', event); event.stopPropagation();">
${escapeAndFormatHtml(ev.title)}
</div>`;
              },
            );
            html += "</div>";
          }
          contentDiv.innerHTML = html;
        } else if (currentMode === "month") {
          contentDiv.className = "month-container";
          let html = '<div class="month-day-header">';
          ["日", "月", "火", "水", "木", "金", "土"].forEach(
            (day) => (html += `<div class="month-day-name">${day}</div>`),
          );
          html += '</div><div class="month-grid">';

          let iterDate = new Date(reqStart);
          while (iterDate < reqEnd) {
            const isOtherMonth = iterDate.getMonth() !== m;
            const cellClass = isOtherMonth
              ? "month-cell other-month"
              : "month-cell";
            const dateStr = iterDate.toDateString();

            html += `<div class="${cellClass}" onclick="switchToDayView(${iterDate.getTime()})">
<div class="month-date-num">${iterDate.getDate()}</div>`;

            (eventsByDate.get(dateStr) || []).forEach((ev) => {
              html += `<div class="month-event" style="background-color:${ev.color}; color:${ev.textColor};${finalEventExtraStyle(ev)}" onclick="openEventModal('${ev.id}', event); event.stopPropagation();">
${escapeAndFormatHtml(ev.title)}
</div>`;
            });
            html += `</div>`;
            iterDate.setDate(iterDate.getDate() + 1);
          }
          html += "</div>";
          contentDiv.innerHTML = html;
        }

        if (isTextWrap) contentDiv.classList.add("wrap-text");
      }

      let lastScreenWidth = window.innerWidth;
      window.addEventListener("resize", () => {
        const currentWidth = window.innerWidth;
        const wasWide = lastScreenWidth >= 768;
        const isWide = currentWidth >= 768;
        if (wasWide !== isWide) {
          if (currentMode === "1" && fetchedEvents.length > 0) {
            renderCalendar();
          }
        }
        lastScreenWidth = currentWidth;
      });

      loadCalendar();
    </script>
  </body>
</html>
